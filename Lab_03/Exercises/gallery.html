<!DOCTYPE html>
<html>

<head>
  <title>Image Styling Portfolio</title>
  <link rel="stylesheet" href="../styles/gallery.css">
</head>

<body>

  <h1>Image Styling Portfolio</h1>

  <div class="gallery">

    <!-- Rounded -->
    <div class="img-box rounded">
      <img src="../images/uet.png">
      <div class="overlay-text">Rounded Image</div>
    </div>

    <!-- Circle -->
    <div class="img-box circle">
      <img src="../images/uet.png">
      <div class="overlay-text">Circle Image</div>
    </div>

    <!-- Border + Shadow -->
    <div class="img-box border-shadow">
      <img src="../images/uet.png">
      <div class="overlay-text">Border & Shadow</div>
    </div>

    <!-- Hover Effect -->
    <div class="img-box hover-zoom">
      <img src="../images/uet.png">
      <div class="overlay-text">Hover Zoom</div>
    </div>

    <!-- Filter -->
    <div class="img-box filter">
      <img src="../images/uet.png">
      <div class="overlay-text">Filter Effect</div>
    </div>

  </div>

</body>

</html>
