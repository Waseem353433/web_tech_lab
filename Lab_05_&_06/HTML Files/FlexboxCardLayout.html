<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Card Layout</title>
    <link rel="stylesheet" href="../CSS Files/FlexboxCardLayout.css">
</head>
<body>

<h1>Flexbox Card Layout</h1>

<div class="card-container">

    <div class="card">
        <h3>Card 1</h3>
        <p>This is short text.</p>
        <div class="actions">
            <button>Read</button>
        </div>
    </div>

    <div class="card">
        <h3>Card 2</h3>
        <p>
            This card has more content.
            Flexbox keeps all cards equal height.
        </p>
        <div class="actions">
            <button>Read</button>
        </div>
    </div>

    <div class="card">
        <h3>Card 3</h3>
        <p>
            More text here to show equal height
            layout using flexbox design system.
        </p>
        <div class="actions">
            <button>Read</button>
        </div>
    </div>

</div>

</body>
</html>
