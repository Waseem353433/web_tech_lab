<!DOCTYPE html>
<html>
<head>
<title>Responsive Form Builder</title>
<link rel="stylesheet" href="../CSS Files/FlexboxFormBuilderwithResponsiveDesign.css">
</head>
<body>

<h1>Responsive Form</h1>

<form class="form">

<div class="row">

<div class="field">
<label>Name</label>
<input type="text">
</div>

<div class="field">
<label>Email</label>
<input type="email">
</div>

</div>


<div class="row">

<div class="field">
<label>Password</label>
<input type="password">
</div>

<div class="field">
<label>Phone</label>
<input type="tel">
</div>

</div>


<div class="row">

<div class="field">
<label>City</label>
<input type="text">
</div>

<div class="field">
<label>Date</label>
<input type="date">
</div>

</div>


<div class="row full">

<div class="field">
<label>Message</label>
<textarea></textarea>
</div>

</div>


<div class="row full">

<button type="submit">Submit</button>

</div>

</form>

</body>
</html>
