<!DOCTYPE html>

<title>CSS Selectors Practice</title>
<link rel="stylesheet" href="../styles/main.css">
</head>
<body>

<h1 id="main-title">CSS Selectors Practice</h1>

<div class="highlight">
  <p>This paragraph is inside a div with a highlight class.</p>
  <h2>Subtitle 1</h2>
  <p>Another paragraph after the subtitle.</p>
  <ul>
    <li>First item</li>
    <li>Second item</li>
    <li>Third item</li>
  </ul>
</div>

<h2>Subtitle 2</h2>
<ul>
  <li>Apple</li>
  <li>Banana</li>
  <li>Cherry</li>
</ul>

<p>Check out this <a href="https://www.example.com">secure link</a> and this <a href="http://example.com">normal link</a>.</p>

<img src="logo.png" alt="site-icon">

<form>
  <input type="text" placeholder="Enter text here">
  <input type="submit" value="Submit">
</form>

</body>
</html>
