<!DOCTYPE html>
<html>
<head>
    <title>Background Gallery</title>
    <link rel="stylesheet" href="../styles/backgrounds.css">
</head>

<body>

<h1>Background Gallery Demonstration</h1>

<div class="box solid">
    <h2>Solid Color Background</h2>
</div>

<div class="box repeat">
    <h2>Image Background (Repeat)</h2>
</div>

<div class="box repeat-x">
    <h2>Image Background (Repeat-X)</h2>
</div>

<div class="box linear">
    <h2>Linear Gradient</h2>
</div>

<div class="box radial">
    <h2>Radial Gradient</h2>
</div>

<div class="box multiple">
    <h2>Multiple Background Layers</h2>
</div>

<div class="box blend">
    <h2>Background Blend Mode</h2>
</div>

</body>
</html>
