<!DOCTYPE html>
<html>
<head>
    <title>Advanced CSS Effects</title>
    <link rel="stylesheet" href="../styles/showcase.css">
</head>
<body>

<h1 class="gradient-text">Advanced CSS Effects</h1>

<!-- Custom Checkbox -->
<h2>Custom Checkbox</h2>

<label class="check">
    <input type="checkbox">
    <span class="custom-box"></span>
    Accept Terms
</label>


<!-- Custom Radio -->
<h2>Custom Radio</h2>

<label class="radio">
    <input type="radio" name="r">
    <span class="custom-radio"></span>
    Option 1
</label>

<label class="radio">
    <input type="radio" name="r">
    <span class="custom-radio"></span>
    Option 2
</label>


<!-- Loading Animation -->
<h2>Loading Animation</h2>

<div class="loader"></div>


<!-- Text Clip Image -->
<h2 class="clip-text">TEXT CLIP EFFECT</h2>


<!-- Shadow Effect -->
<h2 class="shadow-text">Shadow Effect Example</h2>

</body>
</html>
